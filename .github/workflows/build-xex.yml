name: '🎮 Build NUVIO.XEX'
run-name: '🎮 NUVIO.XEX — build #${{ github.run_number }}'

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a preview Release after a successful build?'
        type: boolean
        required: true
        default: false
      version:
        description: 'Release version (example: v0.3.0-alpha.1)'
        type: string
        required: true
        default: 'v0.3.0-alpha.1'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'catalog_manifest.txt'
      - 'stream_addons.txt'
      - '.github/workflows/build-xex.yml'

permissions:
  contents: read

concurrency:
  group: nuvio-xex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-source:
    name: '✅ 1. Check the source code'
    runs-on: ubuntu-24.04
    steps:
      - name: '📥 Download the project'
        uses: actions/checkout@v4
      - name: '🧪 Test catalog and addon parsing'
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -Isrc -Ithird_party/cjson \
            tests/test_stremio.c src/stremio.c third_party/cjson/cJSON.c \
            -lm -o test_stremio
          ./test_stremio

  build-xex:
    name: '🎮 2. Build the Xbox 360 app'
    needs: check-source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      XSDK_ROOT: ${{ github.workspace }}/deps/xsdk
      TOOLCHAIN_ROOT: ${{ github.workspace }}/.toolchain
      BUILD_JOBS: '3'
    steps:
      - name: '📥 Download project files'
        uses: actions/checkout@v4

      - name: '📦 Download pinned open-source dependencies'
        run: |
          mkdir -p deps
          clone_fixed() {
            git clone --depth 1 --single-branch --branch "$2" "$1" "$3"
            if [ "$(git -C "$3" rev-parse HEAD)" != "$4" ]; then
              git -C "$3" fetch --depth 1 origin "$4"
            fi
            git -C "$3" checkout --detach "$4"
          }
          clone_fixed https://github.com/xenosworks/xsdk.git main deps/xsdk 9e6de98f6b5d737bce0fecd2864edae94bdd2637
          clone_fixed https://github.com/xenosworks/curl-xenon.git xenon deps/curl-xenon a6b70bd06820e1c625f47fe0e592e08c5daaa6b4
          clone_fixed https://github.com/xenosworks/mbedtls-xenon.git xenon deps/mbedtls-xenon 591b04adbec4bc5582649601f4407506a610162b
          clone_fixed https://github.com/xenosworks/glslang-xenon.git xenon deps/glslang-xenon d2f00185cf5feaa449f6e15c1894fb232b2b6bcd

      - name: '⚡ Look for a cached PowerPC compiler'
        id: cache-compiler
        uses: actions/cache/restore@v4
        with:
          path: .toolchain
          key: xsdk-gcc-15.3-9e6de98-v2

      - name: '🛠️ Install tools (first build only)'
        if: steps.cache-compiler.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex texinfo libgmp-dev libmpfr-dev \
            libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: '🏗️ Build PowerPC compiler (first build only)'
        if: steps.cache-compiler.outputs.cache-hit != 'true'
        run: |
          PREFIX="$TOOLCHAIN_ROOT" \
            WORK="$RUNNER_TEMP/xsdk-toolchain-work" \
            JOBS="$BUILD_JOBS" \
            bash deps/xsdk/tools/toolchain/build.sh
          test -x "$TOOLCHAIN_ROOT/bin/powerpc-xsdk-elf-gcc"

      - name: '💾 Cache compiler for future builds'
        if: steps.cache-compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .toolchain
          key: xsdk-gcc-15.3-9e6de98-v2

      - name: '⚡ Look for cached graphics tools'
        id: cache-shaders
        uses: actions/cache/restore@v4
        with:
          path: .shader-cache
          key: glslang-xenon-d2f00185-v1

      - name: '🎨 Build graphics tools (if not cached)'
        if: steps.cache-shaders.outputs.cache-hit != 'true'
        run: |
          (cd deps/glslang-xenon && python3 update_glslang_sources.py)
          cmake -S deps/glslang-xenon -B deps/glslang-xenon/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON -DGLSLANG_TESTS=OFF
          cmake --build deps/glslang-xenon/build --parallel "$BUILD_JOBS"
          mkdir -p .shader-cache
          cp deps/glslang-xenon/build/StandAlone/glslang .shader-cache/glslang

      - name: '💾 Cache graphics tools for future builds'
        if: steps.cache-shaders.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .shader-cache
          key: glslang-xenon-d2f00185-v1

      - name: '🖼️ Enable graphics tools'
        run: |
          cp .shader-cache/glslang "$TOOLCHAIN_ROOT/bin/glslang"
          test -s "$TOOLCHAIN_ROOT/bin/glslang"

      - name: '⚙️ Build the Xbox 360 SDK'
        run: |
          make -C "$XSDK_ROOT" -j "$BUILD_JOBS" \
            TOOLCHAIN="$TOOLCHAIN_ROOT/bin/powerpc-xsdk-elf-"

      - name: '🎮 Compile NUVIO.xex'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$XSDK_ROOT/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$TOOLCHAIN_ROOT" \
            -DMBEDTLS_XENON_DIR="$GITHUB_WORKSPACE/deps/mbedtls-xenon" \
            -DCURL_XENON_DIR="$GITHUB_WORKSPACE/deps/curl-xenon" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$BUILD_JOBS"
          test -s build/NUVIO.xex

      - name: '📁 Prepare files for Aurora'
        run: |
          mkdir -p dist
          cp build/NUVIO.xex dist/NUVIO.XEX
          cp build/cacert.pem dist/cacert.pem
          cp catalog_manifest.txt stream_addons.txt INSTALL-ON-XBOX.txt dist/
          (
            cd dist
            zip -q -9 NUVIO-XEX-Preview.zip NUVIO.XEX cacert.pem \
              catalog_manifest.txt stream_addons.txt INSTALL-ON-XBOX.txt
          )
          (cd dist && sha256sum NUVIO-XEX-Preview.zip > SHA256SUMS.txt)

      - name: '📥 Save the build package for maintainers'
        uses: actions/upload-artifact@v4
        with:
          name: NUVIO-XEX-test
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: '✅ Explain where to find the test build'
        if: success()
        run: |
          {
            echo '## 🎮 NUVIO.XEX build succeeded!'
            echo ''
            echo '✅ The compilation steps completed successfully.'
            echo ''
            echo '### 📥 Maintainer download'
            echo '1. Return to this GitHub Actions run.'
            echo '2. Scroll down to **Artifacts**.'
            echo '3. Download **NUVIO-XEX-test**.'
            echo '4. Open the ZIP and read **INSTALL-ON-XBOX.txt**.'
            echo ''
            echo '> ⚠️ Video playback and BitTorrent are still in development. Compilation does not guarantee hardware compatibility.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: '💡 Explain how to troubleshoot a failure'
        if: failure()
        run: |
          {
            echo '## ⚠️ NUVIO.XEX is not ready yet'
            echo ''
            echo 'This build failed. **There is no verified download from this run.**'
            echo ''
            echo '1. Open the failed step marked with ❌.'
            echo '2. Copy the last lines of the error.'
            echo '3. Share them with the maintainer for troubleshooting.'
            echo ''
            echo 'ℹ️ The first build creates the PowerPC compiler. Cached tools speed up later builds.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: '🚀 3. Publish the preview Release'
    needs: build-xex
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: '📥 Download release notes'
        uses: actions/checkout@v4

      - name: '📦 Download successfully built files'
        uses: actions/download-artifact@v4
        with:
          name: NUVIO-XEX-test
          path: release-assets

      - name: '🔎 Check version and archive'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo 'Invalid version. Example: v0.3.0-alpha.1'
            exit 1
          fi
          test -s release-assets/NUVIO-XEX-Preview.zip
          test -s release-assets/SHA256SUMS.txt
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: '🎉 Make the download available in Releases'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" \
            release-assets/NUVIO-XEX-Preview.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "NUVIO.XEX $RELEASE_VERSION — Technical Preview" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease

      - name: '✅ Explain where users download the app'
        run: |
          {
            echo '## 🎉 Release published!'
            echo ''
            echo 'Users can download the preview from the **Releases** page.'
            echo ''
            echo "📥 https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
